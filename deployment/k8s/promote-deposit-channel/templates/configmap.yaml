apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "promote-deposit-channel.fullname" . }}
data:
  appsettings.json: |
    {
      "PromoteDepositChannel": {
        "PromotionServiceUrl": "http://promotion-api",
        "PaymentServiceUrl": "http://payment-api",
        "PlayerServiceUrl": "http://player-api",
        "VipLevelServiceUrl": "http://tgs-viplevel"
      }
    }

  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "{{ .Release.Name }}"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
